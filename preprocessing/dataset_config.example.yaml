# Source game data (preferred: images/ + gt.csv, fallback: tagged_images/ + gameX.csv) and where to write square tiles
data_root: ./data
raw_tiles_dir: ./preprocessed_data

# Tile extraction parameters
tile_size: [224, 224]
tile_overlap: 0.7
zero_padding: true

# Optional Qwen3-VL embeddings (one .npy per tile). Set to null if unused.
embedding_dir: ./embeddings
embedding_ext: .npy

# OPTION 1: Old way (percentages)
# split:
#   train: 0.8
#   val: 0.1
#   test: 0.1

# OPTION 2: New way (Specific Games)
# Use the CSV filenames
split:
  train:
    - "game5"
    - "game6"
    - "game7"
  val:
    - "game2"
    - "game8"
    - "game9"
    - "game10"
  test:
    - "game4"
    - "game11"
    - "game12"

# Reproducibility seed
seed: 42
